<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Questrial&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Workout Generator</h1>
    
    <div id="instructions">Enter the required information below:</div>

    <form action="">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g Michael">
        </div>

        <div class="form-group">
            <label for="goal">Weight Goal</label>
            <select name="goal" id="goal">
                <option value="Gain">Gain</option>
                <option value="Lose">Lose</option>
            </select>
         </div>

        <div class="form-group">
            <label for="experience">Experience</label>
            <select name="experience" id="experience">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
         </div>

        <div class="form-group">
            <label for="days">Days available to work out per week</label>
            <input type="number" name="days" id="days" placeholder="e.g 3 days">
         </div>        
        
        <div class="form-group">
            <label for="time">Time available to work out per workout</label>
            <input type="number" name="time" id="time" placeholder="e.g 60 minutes">
         </div>

        <div class="form-group">
            <label for="equipment">Equipment</label>
            <select name="equipment" id="equipment">
                <option value="gym">Gym</option>
                <option value="home">Home</option>
            </select>
        </div>
    </form>

</body>
</html>

Time: 60 minutes -->
